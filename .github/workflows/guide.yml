# Publishes the user guide (the guide/ folder, nothing else) to GitHub Pages.
# Turn Pages on once: repo Settings > Pages > Source: GitHub Actions.
name: Publish the user guide

on:
  push:
    branches: [main]
    paths: ["guide/**", ".github/workflows/guide.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: guide
      - id: deploy
        uses: actions/deploy-pages@v4
